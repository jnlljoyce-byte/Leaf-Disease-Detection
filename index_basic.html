<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaf Disease Detection System</title>

    <!-- ACTIVITY 4, Step 1: libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <!-- ACTIVITY 8: styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #176b36; }
        video {
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            background: #222;
        }
        button {
            background: #176b36;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #0d4c25; }
        button:disabled { background: #9ab; cursor: not-allowed; }
        #results {
            background: white;
            max-width: 450px;
            margin: 20px auto;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }
        #preview {
            border-radius: 10px;
            margin: 10px;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <!-- ACTIVITY 3: HTML interface -->
    <h1>Leaf Disease Detection System</h1>
    <p>Real-Time Image Classification Using Teachable Machine</p>

    <h3>Camera Preview</h3>
    <video id="camera" autoplay playsinline muted></video>
    <br><br>

    <!-- ACTIVITY 5, Step 1 (Start disabled until model loads: instructor note) -->
    <button id="startBtn" onclick="startCamera()" disabled>Start Camera</button>
    <button onclick="stopCamera()">Stop Camera</button>

    <!-- ACTIVITY 7, Step 1: upload -->
    <h3>Upload Leaf Image</h3>
    <input type="file"
           id="imageUpload"
           accept="image/*"
           capture="environment"
           onchange="classifyImage(event)">
    <br><br>
    <img id="preview" style="max-width:300px; display:none;">

    <h3>Classification Results</h3>
    <div id="results">Waiting for image classification...</div>

    <script>
        // ACTIVITY 4, Step 2: load model
        const MODEL_URL = "./my-model/";
        let model;

        async function loadModel() {
            try {
                model = await tmImage.load(
                    MODEL_URL + "model.json",
                    MODEL_URL + "metadata.json"
                );
                console.log("Model successfully loaded!");
                document.getElementById("results").innerHTML =
                    "Model loaded successfully. Ready for classification.";
                document.getElementById("startBtn").disabled = false;
            } catch (error) {
                console.error(error);
                document.getElementById("results").innerHTML =
                    "Error loading model. Check your model files.";
            }
        }
        loadModel();

        // ACTIVITY 5: camera
        let stream = null;

        async function startCamera() {
            if (stream) return;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" }
                    },
                    audio: false
                });

                const video = document.getElementById("camera");
                video.srcObject = stream;
                await video.play();

                console.log("Camera started successfully!");

                // ACTIVITY 6, Step 2
                detecting = true;
                detectLeaf();

            } catch (error) {
                alert("Unable to access camera: " + error.message);
            }
        }

        function stopCamera() {
            // ACTIVITY 6, Step 3
            detecting = false;

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                document.getElementById("camera").srcObject = null;
                console.log("Camera stopped.");
            }
        }

        // ACTIVITY 6, Step 1: real-time detection
        let detecting = false;

        async function detectLeaf() {
            const video = document.getElementById("camera");

            while (detecting && stream) {
                if (video.readyState >= 2) {
                    const predictions = await model.predict(video);
                    displayResults(predictions);
                }

                await new Promise(resolve => setTimeout(resolve, 300));
            }
        }

        // ACTIVITY 6, Step 4: display results
        function displayResults(predictions) {
            const results = document.getElementById("results");

            const sorted = [...predictions].sort(
                (a, b) => b.probability - a.probability
            );

            let output = "";

            sorted.forEach(item => {
                const confidence = (item.probability * 100).toFixed(2);

                output += `
                    <p><strong>${item.className}</strong>: ${confidence}%</p>
                `;
            });

            results.innerHTML = output;
        }

        // ACTIVITY 7, Step 2: classify uploaded image
        async function classifyImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const image = document.getElementById("preview");
            const imageURL = URL.createObjectURL(file);

            try {
                image.src = imageURL;
                image.style.display = "block";
                await image.decode();

                const predictions = await model.predict(image);
                displayResults(predictions);

            } catch (error) {
                alert("Unable to classify image: " + error.message);
            } finally {
                URL.revokeObjectURL(imageURL);
            }
        }
    </script>
</body>
</html>
